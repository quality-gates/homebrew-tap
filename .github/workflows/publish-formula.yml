name: Publish mess formula
run-name: Publish ${{ inputs.tool }} ${{ inputs.tag }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Supported mess CLI name
        required: true
        type: string
      tag:
        description: Immutable mess CLI release tag
        required: true
        type: string
      release_id:
        description: GitHub release database ID
        required: true
        type: string
      source_sha:
        description: Commit referenced by the release tag
        required: true
        type: string
      request_id:
        description: Unique dispatch correlation ID
        required: true
        type: string

permissions:
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: homebrew-tap-${{ inputs.tool }}
  cancel-in-progress: false

jobs:
  update:
    name: Generate formula pull request
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - id: release
        name: Verify immutable upstream release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool }}
          TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          ruby script/tool_registry.rb validate "$TOOL"
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${TAG#v}"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          ARM64_ASSET="${TOOL}_${VERSION}_darwin_arm64.tar.gz"
          AMD64_ASSET="${TOOL}_${VERSION}_darwin_amd64.tar.gz"

          release="$(gh api "repos/quality-gates/$TOOL/releases/$RELEASE_ID")"
          test "$(jq -r .tag_name <<<"$release")" = "$TAG"
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .prerelease <<<"$release")" = false
          test "$(jq -r .immutable <<<"$release")" = true

          ref="$(gh api "repos/quality-gates/$TOOL/git/ref/tags/$TAG")"
          object_type="$(jq -r .object.type <<<"$ref")"
          object_sha="$(jq -r .object.sha <<<"$ref")"
          for _depth in {1..8}; do
            [[ "$object_type" == tag ]] || break
            tag_object="$(gh api "repos/quality-gates/$TOOL/git/tags/$object_sha")"
            object_type="$(jq -r .object.type <<<"$tag_object")"
            object_sha="$(jq -r .object.sha <<<"$tag_object")"
          done
          test "$object_type" = commit
          test "$object_sha" = "$SOURCE_SHA"

          expected_assets="$(ruby script/tool_registry.rb release-assets "$TOOL" "$VERSION")"
          actual_assets="$(jq -r '[.assets[].name] | sort | .[]' <<<"$release")"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "The immutable release does not match the registered asset contract." >&2
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi

          mkdir dist
          gh release download "$TAG" --repo "quality-gates/$TOOL" --dir dist \
            --pattern "$AMD64_ASSET" --pattern "$ARM64_ASSET" --pattern checksums.txt
          expected_manifest="$(printf '%s\n' "$AMD64_ASSET" "$ARM64_ASSET" | LC_ALL=C sort)"
          manifest_assets="$(awk 'NF == 2 { sub(/^\*/, "", $2); print $2 }' dist/checksums.txt | LC_ALL=C sort)"
          test "$manifest_assets" = "$expected_manifest"
          (cd dist && sha256sum -c checksums.txt)
          arm64_sha="$(awk -v asset="$ARM64_ASSET" '$2 == asset { print $1 }' dist/checksums.txt)"
          amd64_sha="$(awk -v asset="$AMD64_ASSET" '$2 == asset { print $1 }' dist/checksums.txt)"
          [[ "$arm64_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$amd64_sha" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "version=$VERSION"
            echo "arm64_sha=$arm64_sha"
            echo "amd64_sha=$amd64_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Generate deterministic formula
        env:
          TOOL: ${{ inputs.tool }}
          VERSION: ${{ steps.release.outputs.version }}
          ARM64_SHA: ${{ steps.release.outputs.arm64_sha }}
          AMD64_SHA: ${{ steps.release.outputs.amd64_sha }}
        run: script/render-formula "$TOOL" "$VERSION" "$ARM64_SHA" "$AMD64_SHA" "Formula/$TOOL.rb"

      - id: change
        name: Reject downgrades and detect idempotent retries
        shell: bash
        env:
          TOOL: ${{ inputs.tool }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if git show "HEAD:Formula/$TOOL.rb" >/tmp/current-formula.rb 2>/dev/null; then
            # shellcheck disable=SC2016
            current_version="$(ruby -ne 'puts $1 if /^\s*version "([^"]+)"/' /tmp/current-formula.rb)"
            if ruby -e 'require "rubygems"; exit(Gem::Version.new(ARGV[0]) < Gem::Version.new(ARGV[1]) ? 0 : 1)' "$VERSION" "$current_version"; then
              echo "Refusing to replace $TOOL $current_version with older version $VERSION." >&2
              exit 1
            fi
          fi
          if git ls-files --error-unmatch "Formula/$TOOL.rb" >/dev/null 2>&1 && \
            git diff --quiet -- "Formula/$TOOL.rb"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The default-branch formula already matches $VERSION." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test formula generator
        if: steps.change.outputs.changed == 'true'
        run: ruby test/render_formula_test.rb

      - id: pr
        name: Create or update protected formula PR
        if: steps.change.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          branch="automation/$TOOL-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          branch_matches=false
          if [[ -n "$remote_sha" ]]; then
            git fetch origin "refs/heads/$branch"
            remote_changes="$(git diff --name-only HEAD "$remote_sha")"
            if [[ "$remote_changes" == "Formula/$TOOL.rb" ]] && \
              git show "$remote_sha:Formula/$TOOL.rb" >/tmp/branch-formula.rb 2>/dev/null && \
              cmp -s "Formula/$TOOL.rb" /tmp/branch-formula.rb; then
              branch_matches=true
            fi
          fi
          if [[ "$branch_matches" != true ]]; then
            git checkout -B "$branch"
            git add "Formula/$TOOL.rb"
            git commit -m "Update $TOOL to $VERSION"
            git push origin "HEAD:refs/heads/$branch" \
              --force-with-lease="refs/heads/$branch:$remote_sha"
          fi

          pr_url="$(gh pr list --head "$branch" --base main --state open --json url --jq '.[0].url')"
          if [[ -z "$pr_url" ]]; then
            pr_url="$(gh pr create \
              --base main --head "$branch" \
              --title "Update $TOOL to $VERSION" \
              --body "Updates the $TOOL formula from immutable release [$TAG](https://github.com/quality-gates/$TOOL/releases/tag/$TAG).

          - Release ID: \`$RELEASE_ID\`
          - Source commit: \`$SOURCE_SHA\`
          - Tap workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Formula PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for formula checks
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          checks_found=false
          for _attempt in {1..20}; do
            check_count="$(gh pr checks "$PR_URL" --json name --jq 'length' 2>/dev/null || true)"
            if [[ "$check_count" =~ ^[1-9][0-9]*$ ]]; then
              checks_found=true
              break
            fi
            sleep 15
          done
          if [[ "$checks_found" != true ]]; then
            echo "No formula checks were registered for $PR_URL." >&2
            exit 1
          fi
          gh pr checks "$PR_URL" --watch --fail-fast --interval 15

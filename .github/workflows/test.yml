name: Test tap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    name: Test formula generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: ruby test/render_formula_test.rb

  install:
    name: Install on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            machine: arm64
          - runner: macos-15-intel
            machine: x86_64
          - runner: macos-26
            machine: arm64
          - runner: macos-26-intel
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: formula
        shell: bash
        run: echo "present=$([[ -n "$(find Formula -name '*.rb' -print -quit 2>/dev/null)" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Tap candidate repository
        if: steps.formula.outputs.present == 'true'
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          brew tap quality-gates/tap "$GITHUB_WORKSPACE"
      - name: Audit, install, and test formulas
        if: steps.formula.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for formula in Formula/*.rb; do
            tool="$(basename "$formula" .rb)"
            brew audit --strict --online "quality-gates/tap/$tool"
            brew style "quality-gates/tap/$tool"
            brew install "quality-gates/tap/$tool"
            brew test "quality-gates/tap/$tool"
            # shellcheck disable=SC2016
            version="$(ruby -ne 'puts $1 if /^\s*version "([^"]+)"/' "$formula")"
            "$tool" --version | grep -F "$version"
          done

  upgrade:
    name: Upgrade changed formula on ${{ matrix.runner }}
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            machine: arm64
          - runner: macos-15-intel
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install predecessor and upgrade to candidate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- 'Formula/*.rb')"
          if [[ -z "$changed" ]]; then
            echo "No formula changed; upgrade test is not applicable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$(wc -l <<<"$changed" | tr -d ' ')" != 1 ]]; then
            echo "Expected exactly one changed formula; got: $changed" >&2
            exit 1
          fi
          tool="$(basename "$changed" .rb)"
          candidate_sha="$(git rev-parse HEAD)"
          brew tap quality-gates/tap "$GITHUB_WORKSPACE"
          tap_dir="$(brew --repo quality-gates/tap)"
          if ! git -C "$tap_dir" cat-file -e "$BASE_SHA:Formula/$tool.rb" 2>/dev/null; then
            if [[ -z "$(git -C "$tap_dir" rev-list -n 1 "$BASE_SHA" -- "Formula/$tool.rb")" ]]; then
              echo "First formula publication: upgrade test is not applicable." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "The predecessor formula is missing from a tap that previously published it." >&2
            exit 1
          fi
          git -C "$tap_dir" checkout --detach "$BASE_SHA"
          brew install "quality-gates/tap/$tool"
          previous="$("$tool" --version)"
          git -C "$tap_dir" checkout --detach "$candidate_sha"
          brew upgrade "quality-gates/tap/$tool"
          current="$("$tool" --version)"
          # shellcheck disable=SC2016
          version="$(ruby -ne 'puts $1 if /^\s*version "([^"]+)"/' "Formula/$tool.rb")"
          grep -F "$version" <<<"$current"
          test "$current" != "$previous"

name: Test tap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    name: Test formula generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: ruby -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |file| require File.expand_path(file) }'

  install:
    name: Install on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            machine: arm64
          - runner: macos-15-intel
            machine: x86_64
          - runner: macos-26
            machine: arm64
          - runner: macos-26-intel
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require the complete formula inventory
        run: ruby script/formula_inventory.rb Formula
      - name: Tap candidate repository
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          brew tap quality-gates/tap "$GITHUB_WORKSPACE"
      - name: Audit, install, and test formulas
        shell: bash
        run: |
          set -euo pipefail
          for formula in Formula/*.rb; do
            tool="$(basename "$formula" .rb)"
            brew audit --strict --online "quality-gates/tap/$tool"
            brew style "quality-gates/tap/$tool"
            brew install "quality-gates/tap/$tool"
            brew test "quality-gates/tap/$tool"
            version="$(script/formula-version "$formula")"
            "$tool" --version | grep -F "$version"
          done

  upgrade:
    name: Upgrade changed formula on ${{ matrix.runner }}
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            machine: arm64
          - runner: macos-15-intel
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install predecessor and upgrade to candidate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- 'Formula/*.rb')"
          if [[ -z "$changed" ]]; then
            echo "No formula changed; upgrade test is not applicable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          release_formula=""
          while IFS= read -r formula; do
            [[ -n "$formula" ]] || continue
            if git show "$BASE_SHA:$formula" > "$RUNNER_TEMP/base-formula.rb" 2>/dev/null; then
              base_version="$(script/formula-version "$RUNNER_TEMP/base-formula.rb")"
              candidate_version="$(script/formula-version "$formula")"
              [[ "$base_version" != "$candidate_version" ]] || continue
            fi
            if [[ -n "$release_formula" ]]; then
              echo "Expected exactly one formula version change; got $release_formula and $formula." >&2
              exit 1
            fi
            release_formula="$formula"
          done <<<"$changed"
          if [[ -z "$release_formula" ]]; then
            echo "No formula version changed; upgrade test is not applicable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$release_formula" =~ ^Formula/[a-z0-9]+\.rb$ ]]; then
            echo "Invalid release formula path: $release_formula" >&2
            exit 1
          fi
          changed="$release_formula"
          tool="$(basename "$changed" .rb)"
          candidate_sha="$(git rev-parse HEAD)"
          brew tap quality-gates/tap "$GITHUB_WORKSPACE"
          tap_dir="$(brew --repo quality-gates/tap)"
          if ! git -C "$tap_dir" cat-file -e "$BASE_SHA:Formula/$tool.rb" 2>/dev/null; then
            if [[ -z "$(git -C "$tap_dir" rev-list -n 1 "$BASE_SHA" -- "Formula/$tool.rb")" ]]; then
              echo "First formula publication: upgrade test is not applicable." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "The predecessor formula is missing from a tap that previously published it." >&2
            exit 1
          fi
          git -C "$tap_dir" checkout --detach "$BASE_SHA"
          brew install "quality-gates/tap/$tool"
          previous="$("$tool" --version)"
          git -C "$tap_dir" checkout --detach "$candidate_sha"
          brew upgrade "quality-gates/tap/$tool"
          current="$("$tool" --version)"
          version="$(script/formula-version "Formula/$tool.rb")"
          grep -F "$version" <<<"$current"
          test "$current" != "$previous"
